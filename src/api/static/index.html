<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Data</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  html { background: #f5f5f5; }
  .chart-container { position: relative; height: 300px; }
  .card { margin-bottom: 1rem; }
  .stock-row { cursor: pointer; }
  .stock-row:hover { background: #f0f7ff; }
  .navbar { background: #1a1a2e; }
  .navbar-item, .navbar-item:hover { color: #fff !important; }
  .navbar-item.is-active { background: #16213e !important; }
  .section { padding: 1.5rem; }
  .price-up { color: #e74c3c; }
  .price-down { color: #27ae60; }
  .tab-content { display: none; }
  .tab-content.is-active { display: block; }
  .pagination-info { margin: 0.5rem 0; color: #666; font-size: 0.875rem; }
  .modal-card { width: 90vw; max-height: 85vh; }
  .modal-card-body { overflow-y: auto; }
  .toast { position: fixed; top: 20px; right: 20px; z-index: 100; }
  @media (prefers-color-scheme: dark) {
    html { background: #0a0a0a; }
    .card, .box { background: #1a1a2e; color: #e0e0e0; }
    .table { background: #1a1a2e; color: #e0e0e0; }
    .table th { color: #aaa; }
    .modal-card, .modal-card-head, .modal-card-body, .modal-card-foot { background: #1a1a2e; color: #e0e0e0; }
    .input, .select select, .textarea { background: #16213e; color: #e0e0e0; border-color: #333; }
    .stock-row:hover { background: #16213e; }
    .navbar { background: #0f0f23; }
    .navbar-item.is-active { background: #1a1a3e !important; }
  }
</style>
</head>
<body>
<nav class="navbar" role="navigation">
  <div class="navbar-brand">
    <a class="navbar-item" href="#" style="font-weight:700;font-size:1.2rem">Stock Data</a>
  </div>
  <div class="navbar-menu">
    <div class="navbar-start">
      <a class="navbar-item is-active" data-tab="dashboard" onclick="switchTab('dashboard')">Dashboard</a>
      <a class="navbar-item" data-tab="stocks" onclick="switchTab('stocks')">Stocks</a>
      <a class="navbar-item" data-tab="watchlist" onclick="switchTab('watchlist')">Watchlist</a>
      <a class="navbar-item" data-tab="indices" onclick="switchTab('indices')">Indices</a>
      <a class="navbar-item" data-tab="short" onclick="switchTab('short')">Short Selling</a>
      <a class="navbar-item" data-tab="queue" onclick="switchTab('queue')">Queue</a>
      <a class="navbar-item" data-tab="logs" onclick="switchTab('logs')">Logs</a>
    </div>
  </div>
</nav>

<section class="section">
  <div id="tab-dashboard" class="tab-content is-active"></div>
  <div id="tab-stocks" class="tab-content"></div>
  <div id="tab-watchlist" class="tab-content"></div>
  <div id="tab-indices" class="tab-content"></div>
  <div id="tab-short" class="tab-content"></div>
  <div id="tab-queue" class="tab-content"></div>
  <div id="tab-logs" class="tab-content"></div>
</section>

<div class="modal" id="stock-modal">
  <div class="modal-background" onclick="closeModal()"></div>
  <div class="modal-card">
    <header class="modal-card-head">
      <p class="modal-card-title" id="modal-title">Stock Detail</p>
      <button class="delete" onclick="closeModal()"></button>
    </header>
    <section class="modal-card-body" id="modal-body"></section>
  </div>
</div>

<script>
const API = "/api";

async function apiFetch(path, opts) {
  const r = await fetch(`${API}${path}`, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok && !data.status) throw new Error(JSON.stringify(data));
  return data;
}

function fmt(v, d = 4) {
  if (v == null || v === "") return "-";
  const n = Number(v);
  if (Math.abs(n) >= 1e8) return (n / 1e8).toFixed(2) + "B";
  if (Math.abs(n) >= 1e4) return (n / 1e4).toFixed(2) + "M";
  return n.toLocaleString(undefined, { maximumFractionDigits: d });
}
const fmtPrice = v => v == null ? "-" : Number(v).toFixed(3);
const fmtPct = v => {
  if (v == null) return "-";
  const n = Number(v);
  return `<span class="${n >= 0 ? "price-up" : "price-down"}">${n >= 0 ? "+" : ""}${n.toFixed(2)}%</span>`;
};

function toast(msg, isErr = false) {
  const el = document.createElement("div");
  el.className = `notification ${isErr ? "is-danger" : "is-success"} toast`;
  el.innerHTML = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function renderPagination(total, limit, offset, onPage) {
  if (total <= limit) return "";
  const current = Math.floor(offset / limit) + 1, pages = Math.ceil(total / limit);
  let h = '<nav class="pagination is-small"><ul class="pagination-list">';
  if (current > 1) h += `<li><a class="pagination-link" onclick="${onPage(0)}">First</a></li><li><a class="pagination-link" onclick="${onPage(offset - limit)}">Prev</a></li>`;
  h += `<li><span class="pagination-link is-current">${current}/${pages}</span></li>`;
  if (current < pages) h += `<li><a class="pagination-link" onclick="${onPage(offset + limit)}">Next</a></li><li><a class="pagination-link" onclick="${onPage((pages - 1) * limit)}">Last</a></li>`;
  return h + '</ul></nav>' + `<p class="pagination-info">${offset + 1}-${Math.min(offset + limit, total)} of ${total}</p>`;
}

function switchTab(name) {
  document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("is-active"));
  document.querySelectorAll(".navbar-item[data-tab]").forEach(t => t.classList.remove("is-active"));
  document.getElementById(`tab-${name}`).classList.add("is-active");
  document.querySelector(`.navbar-item[data-tab="${name}"]`).classList.add("is-active");
}

// ---------- Dashboard ----------
async function loadDashboard() {
  const d = await apiFetch("/overview");
  document.getElementById("tab-dashboard").innerHTML = `
    <div class="columns is-multiline">
      <div class="column is-3"><div class="box has-text-centered"><p class="heading">Stocks</p><p class="title">${d.total_stocks}</p></div></div>
      <div class="column is-3"><div class="box has-text-centered"><p class="heading">Watchlist</p><p class="title">${d.watchlist}</p></div></div>
      <div class="column is-3"><div class="box has-text-centered"><p class="heading">Trading Days</p><p class="title">${d.trading_days}</p></div></div>
      <div class="column is-3"><div class="box has-text-centered"><p class="heading">Latest Date</p><p class="title is-5">${d.latest_trade_date || "-"}</p></div></div>
    </div>
    <div class="columns"><div class="column is-12"><div class="box has-text-centered">
      <p class="heading">Total Prices Stored</p><p class="title">${fmt(d.total_prices)}</p></div></div></div>`;
}

// ---------- Stocks ----------
let stockState = { search: "", market: "", watchlist: "", limit: 50, offset: 0 };

async function loadStocks() {
  const s = stockState;
  let q = `/stocks?search=${encodeURIComponent(s.search)}&limit=${s.limit}&offset=${s.offset}`;
  if (s.market) q += `&market=${s.market}`;
  if (s.watchlist !== "") q += `&watchlist=${s.watchlist}`;
  const data = await apiFetch(q);
  document.getElementById("tab-stocks").innerHTML = `
    <div class="field has-addons">
      <div class="control is-expanded"><input class="input" id="stk-search" type="text" placeholder="Search ticker or name..." value="${s.search}"></div>
      <div class="control"><button class="button is-info" onclick="stockState.search=document.getElementById('stk-search').value;stockState.offset=0;loadStocks()">Search</button></div>
      <div class="control"><div class="select"><select onchange="stockState.market=this.value;stockState.offset=0;loadStocks()">
        <option value="" ${!s.market?"selected":""}>All markets</option>
        <option value="HK" ${s.market==="HK"?"selected":""}>HK</option>
        <option value="US" ${s.market==="US"?"selected":""}>US</option>
        <option value="CN" ${s.market==="CN"?"selected":""}>CN</option></select></div></div>
      <div class="control"><div class="select"><select onchange="stockState.watchlist=this.value;stockState.offset=0;loadStocks()">
        <option value="" ${s.watchlist===""?"selected":""}>Any watchlist</option>
        <option value="true" ${s.watchlist==="true"?"selected":""}>Watchlist only</option></select></div></div>
    </div>
    ${renderPagination(data.total, s.limit, s.offset, "stockState.offset=__VAL__;loadStocks()")}
    <div class="table-container"><table class="table is-fullwidth is-striped is-hoverable is-size-7">
      <thead><tr><th>Ticker</th><th>Name</th><th>Market</th><th>Watchlist</th><th>Status</th><th>First</th><th>Last</th></tr></thead>
      <tbody>${data.stocks.map(st => `<tr class="stock-row" onclick="openStock('${jsStr(st.ticker)}')">
        <td><strong>${esc(st.ticker)}</strong></td><td>${esc(st.name)}</td>
        <td><span class="tag is-info">${st.market_code}</span></td>
        <td>${st.watchlist ? "✓" : ""}</td>
        <td><span class="tag ${st.status==="active"?"is-success":"is-danger"}">${st.status}</span></td>
        <td>${st.first_date||"-"}</td><td>${st.last_date||"-"}</td></tr>`).join("")}</tbody>
    </table></div>`;
  document.getElementById("stk-search").addEventListener("keyup", e => {
    if (e.key === "Enter") { stockState.search = e.target.value; stockState.offset = 0; loadStocks(); }
  });
}

async function openStock(ticker) {
  document.getElementById("modal-title").textContent = `${ticker}`;
  const body = document.getElementById("modal-body");
  body.innerHTML = '<p class="has-text-grey">Loading...</p>';
  document.getElementById("stock-modal").classList.add("is-active");

  const q = await apiFetch(`/stocks/${encodeURIComponent(ticker)}/prices?limit=200`);
  if (q.status === "queued") {
    body.innerHTML = `<div class="notification is-warning">Data not in DB yet — fetch queued.<br>${q.message}<br>
      <button class="button is-small is-info mt-2" onclick="openStock('${jsStr(ticker)}')">Retry</button></div>`;
    return;
  }
  const ca = await apiFetch(`/stocks/${encodeURIComponent(ticker)}/corporate-actions`);
  const f = await apiFetch(`/stocks/${encodeURIComponent(ticker)}/fundamentals`);

  let html = `<div class="columns is-multiline">`;
  if (f.fundamentals) {
    const fu = f.fundamentals;
    html += `<div class="column is-12"><div class="box"><p>
      <strong>${fu.sector||"-"}</strong> / ${fu.industry||"-"}
      &nbsp;·&nbsp; Mkt Cap ${fmt(fu.market_cap)} &nbsp;·&nbsp; P/E ${fu.pe_ratio==null?"-":Number(fu.pe_ratio).toFixed(2)}
      &nbsp;·&nbsp; EPS ${fu.eps==null?"-":Number(fu.eps).toFixed(2)} &nbsp;·&nbsp; Yield ${fu.dividend_yield==null?"-":(Number(fu.dividend_yield)*100).toFixed(2)+"%"}</p></div></div>`;
  }
  if (q.prices && q.prices.length) {
    html += `<div class="column is-12"><div class="chart-container"><canvas id="price-chart"></canvas></div></div>`;
    html += `<div class="column is-12"><h5 class="title is-6">Prices (last ${q.prices.length})</h5>
      <div class="table-container"><table class="table is-fullwidth is-striped is-size-7">
        <thead><tr><th>Date</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Adj Close</th><th>Vol</th><th>Source</th></tr></thead>
        <tbody>${q.prices.map(p => `<tr><td>${p.trade_date}</td><td>${fmtPrice(p.open)}</td><td>${fmtPrice(p.high)}</td><td>${fmtPrice(p.low)}</td>
          <td><strong>${fmtPrice(p.close)}</strong></td><td>${fmtPrice(p.adj_close)}</td><td>${fmt(p.volume)}</td><td><span class="tag is-light">${p.source_code}</span></td></tr>`).join("")}</tbody>
      </table></div></div>`;
  }
  if (ca.actions && ca.actions.length) {
    html += `<div class="column is-12"><h5 class="title is-6">Corporate Actions</h5>
      <div class="table-container"><table class="table is-fullwidth is-striped is-size-7">
        <thead><tr><th>Date</th><th>Type</th><th>Split Ratio</th><th>Dividend</th><th>Source</th></tr></thead>
        <tbody>${ca.actions.map(a => `<tr><td>${a.action_date}</td><td><span class="tag is-warning">${a.action_type}</span></td>
          <td>${a.split_ratio??"-"}</td><td>${a.dividend_amount??"-"}</td><td>${a.source_code}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  html += "</div>";
  body.innerHTML = html;
  if (q.prices && q.prices.length) setTimeout(() => drawChart(q.prices), 100);
}

function drawChart(prices) {
  const canvas = document.getElementById("price-chart");
  if (!canvas) return;
  const d = [...prices].reverse();
  new Chart(canvas.getContext("2d"), {
    type: "line",
    data: { labels: d.map(p => p.trade_date), datasets: [
      { label: "Close", data: d.map(p => Number(p.close)), borderColor: "#2563eb", backgroundColor: "rgba(37,99,235,0.1)", fill: true, tension: 0.1, pointRadius: 1 },
      { label: "High", data: d.map(p => Number(p.high)), borderColor: "#16a34a", borderDash: [3,3], pointRadius: 0 },
      { label: "Low", data: d.map(p => Number(p.low)), borderColor: "#dc2626", borderDash: [3,3], pointRadius: 0 },
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "top", labels: { boxWidth: 12, padding: 8 } } },
      scales: { x: { ticks: { maxTicksLimit: 10, font: { size: 10 } } }, y: { ticks: { font: { size: 10 } } } } },
  });
}
function closeModal() { document.getElementById("stock-modal").classList.remove("is-active"); }

// ---------- Watchlist ----------
let wlState = { market: "", limit: 100, offset: 0 };

async function loadWatchlist() {
  const s = wlState;
  let q = `/watchlist`;
  if (s.market) q += `?market=${s.market}`;
  const data = await apiFetch(q);
  document.getElementById("tab-watchlist").innerHTML = `
    <h3 class="title is-5">Watchlist</h3>
    <div class="columns">
      <div class="column is-6"><div class="card"><div class="card-header"><p class="card-header-title">Add / Import</p></div>
        <div class="card-content">
          <div class="field"><label class="label">Tickers (one per line, e.g. 0700.HK, AAPL, 00700)</label>
          <div class="control"><textarea class="textarea" id="wl-text" rows="6" placeholder="0700.HK&#10;AAPL&#10;MSFT&#10;00700"></textarea></div></div>
          <div class="field"><label class="label">Market (optional, default auto-detect)</label>
          <div class="control"><div class="select"><select id="wl-market"><option value="">Auto</option><option value="HK">HK</option><option value="US">US</option><option value="CN">CN</option></select></div></div></div>
          <div class="field is-grouped">
            <div class="control"><button class="button is-info" onclick="addWatchlist()">Add</button></div>
            <div class="control"><button class="button is-primary" onclick="importWatchlist()">Import</button></div>
            <div class="control"><a class="button is-light" href="/api/watchlist/export">Export CSV</a></div>
          </div>
        </div></div></div>
      <div class="column is-6"><div class="card"><div class="card-header"><p class="card-header-title">Current Watchlist</p></div>
        <div class="card-content"><div class="table-container"><table class="table is-fullwidth is-striped is-size-7">
          <thead><tr><th>Ticker</th><th>Name</th><th>Market</th><th></th></tr></thead>
          <tbody>${data.stocks.map(st => `<tr>
            <td><strong>${esc(st.ticker)}</strong></td><td>${esc(st.name)}</td><td>${esc(st.market_code)}</td>
            <td><button class="button is-small is-danger is-outlined" onclick="removeWatch('${jsStr(st.ticker)}')">Remove</button></td></tr>`).join("")}
          </tbody></table></div></div></div></div>
    </div>`;
}

async function addWatchlist() {
  const tickers = document.getElementById("wl-text").value.split("\n").map(t => t.trim()).filter(Boolean);
  if (!tickers.length) return toast("Enter at least one ticker", true);
  const r = await apiFetch("/watchlist", { method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ tickers, market: document.getElementById("wl-market").value }) });
  toast(`Added: ${r.added.join(", ")}`);
  loadWatchlist();
}
async function importWatchlist() {
  const text = document.getElementById("wl-text").value;
  if (!text.trim()) return toast("Enter tickers to import", true);
  const r = await apiFetch("/watchlist/import", { method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ text, market: document.getElementById("wl-market").value }) });
  toast(`Imported: ${r.added.join(", ")}`);
  loadWatchlist();
}
async function removeWatch(ticker) {
  await apiFetch(`/watchlist/${encodeURIComponent(ticker)}`, { method: "DELETE" });
  toast(`Removed ${ticker}`);
  loadWatchlist();
}

// ---------- Indices ----------
let idxState = { market: "", limit: 50, offset: 0 };
async function loadIndices() {
  const s = idxState;
  let q = `/indices?limit=${s.limit}&offset=${s.offset}`;
  if (s.market) q += `&market=${s.market}`;
  const data = await apiFetch(q);
  document.getElementById("tab-indices").innerHTML = `
    <h3 class="title is-5">Market Indices</h3>
    <div class="field"><div class="control"><div class="select"><select onchange="idxState.market=this.value;idxState.offset=0;loadIndices()">
      <option value="" ${!s.market?"selected":""}>All</option><option value="HK" ${s.market==="HK"?"selected":""}>HK</option><option value="US" ${s.market==="US"?"selected":""}>US</option><option value="CN" ${s.market==="CN"?"selected":""}>CN</option></select></div></div></div>
    ${renderPagination(data.total, s.limit, s.offset, "idxState.offset=__VAL__;loadIndices()")}
    <div class="table-container"><table class="table is-fullwidth is-striped is-hoverable is-size-7">
      <thead><tr><th>Date</th><th>Index</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Chg%</th><th>Source</th></tr></thead>
      <tbody>${data.indices.map(i => `<tr><td>${i.trade_date}</td><td><strong>${i.index_name||i.index_code}</strong></td>
        <td>${fmtPrice(i.open)}</td><td>${fmtPrice(i.high)}</td><td>${fmtPrice(i.low)}</td>
        <td><strong>${fmtPrice(i.close)}</strong></td><td>${fmtPct(i.change_pct)}</td><td>${i.source_code}</td></tr>`).join("")}</tbody>
    </table></div>`;
}

// ---------- Short selling ----------
let ssState = { ticker: "", trade_date: "", limit: 50, offset: 0 };
async function loadShort() {
  const s = ssState;
  let q = `/short-selling?limit=${s.limit}&offset=${s.offset}`;
  if (s.ticker) q += `&ticker=${encodeURIComponent(s.ticker)}`;
  if (s.trade_date) q += `&trade_date=${s.trade_date}`;
  const data = await apiFetch(q);
  document.getElementById("tab-short").innerHTML = `
    <h3 class="title is-5">Short Selling (HKEX)</h3>
    <div class="field has-addons">
      <div class="control"><input class="input" id="ss-ticker" type="text" placeholder="Ticker (e.g. 0700.HK)" value="${s.ticker}"></div>
      <div class="control"><input class="input" id="ss-date" type="date" value="${s.trade_date}"></div>
      <div class="control"><button class="button is-info" onclick="ssState.ticker=document.getElementById('ss-ticker').value;ssState.trade_date=document.getElementById('ss-date').value;ssState.offset=0;loadShort()">Filter</button></div>
    </div>
    ${renderPagination(data.total, s.limit, s.offset, "ssState.offset=__VAL__;loadShort()")}
    <div class="table-container"><table class="table is-fullwidth is-striped is-hoverable is-size-7">
      <thead><tr><th>Date</th><th>Ticker</th><th>Short Shares</th><th>Short Turnover</th><th>Total Turnover</th><th>Short %</th></tr></thead>
      <tbody>${data.entries.map(e => { const pct = e.total_turnover ? ((e.short_turnover/e.total_turnover)*100).toFixed(1)+"%" : "-";
        return `<tr><td>${e.trade_date}</td><td><strong>${e.ticker}</strong></td><td>${fmt(e.short_shares)}</td><td>${fmt(e.short_turnover)}</td><td>${fmt(e.total_turnover)}</td><td>${pct}</td></tr>`; }).join("")}</tbody>
    </table></div>`;
}

// ---------- Queue ----------
async function loadQueue() {
  const data = await apiFetch("/queue?limit=100");
  document.getElementById("tab-queue").innerHTML = `
    <h3 class="title is-5">Download Queue</h3>
    <div class="table-container"><table class="table is-fullwidth is-striped is-size-7">
      <thead><tr><th>ID</th><th>Market</th><th>Ticker</th><th>Type</th><th>Status</th><th>Error</th><th>Created</th></tr></thead>
      <tbody>${data.items.map(i => `<tr><td>${i.id}</td><td>${i.market_code}</td><td><strong>${i.ticker}</strong></td><td>${i.data_type}</td>
        <td><span class="tag ${i.status==="completed"?"is-success":i.status==="failed"?"is-danger":"is-warning"}">${i.status}</span></td>
        <td class="is-size-7" style="max-width:200px">${i.error_message||"-"}</td><td class="is-size-7">${i.created_at||"-"}</td></tr>`).join("")}</tbody>
    </table></div>`;
}

// ---------- Logs ----------
async function loadLogs() {
  const data = await apiFetch("/logs?limit=100");
  document.getElementById("tab-logs").innerHTML = `
    <h3 class="title is-5">Scan Logs</h3>
    <div class="table-container"><table class="table is-fullwidth is-striped is-size-7">
      <thead><tr><th>ID</th><th>Market</th><th>Source</th><th>Type</th><th>Status</th><th>Processed</th><th>Inserted</th><th>Error</th><th>Completed</th></tr></thead>
      <tbody>${data.logs.map(l => `<tr><td>${l.id}</td><td>${l.market_code||"-"}</td><td>${l.source_code||"-"}</td><td>${l.scan_type}</td>
        <td><span class="tag ${l.status==="success"?"is-success":"is-danger"}">${l.status}</span></td><td>${l.items_processed??"-"}</td><td>${l.items_inserted??"-"}</td>
        <td class="is-size-7" style="max-width:200px">${l.error_message||"-"}</td><td class="is-size-7">${l.completed_at||"-"}</td></tr>`).join("")}</tbody>
    </table></div>`;
}

// ---------- Init ----------
loadDashboard();
loadStocks();
loadWatchlist();
loadIndices();
loadShort();
loadQueue();
loadLogs();
</script>
</body>
</html>
