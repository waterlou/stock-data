services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hkex
      POSTGRES_PASSWORD: hkex
      POSTGRES_DB: hkex
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hkex"]
      interval: 5s
      timeout: 5s
      retries: 5

  scraper:
    build: .
    environment:
      DATABASE_URL: postgresql://hkex:hkex@postgres:5432/hkex
      SCRAPE_TIME: "17:00"
      TZ: Asia/Hong_Kong
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
