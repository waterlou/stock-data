# Deploy compose — uses pre-built image from GitHub Container Registry.
# Then: docker compose -f docker-compose.deploy.yml pull
#       docker compose -f docker-compose.deploy.yml up -d

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hkex
      POSTGRES_PASSWORD: hkex
      POSTGRES_DB: hkex
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hkex"]
      interval: 5s
      timeout: 5s
      retries: 5

  scraper:
    image: ghcr.io/waterlou/stock-data:latest
    environment:
      DATABASE_URL: postgresql://hkex:hkex@postgres:5432/hkex
      SCRAPE_TIME: "17:00"
      TZ: Asia/Hong_Kong
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/waterlou/stock-data:latest
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://hkex:hkex@postgres:5432/hkex
      TZ: Asia/Hong_Kong
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
